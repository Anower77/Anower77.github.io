<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complexity</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #090d16;
      background-image: 
        radial-gradient(at 50% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(147, 51, 234, 0.1) 0px, transparent 50%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #f8fafc;
      overflow: hidden;
    }
    .redirect-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 36px;
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #ffffff;
      background: linear-gradient(135deg, #f9f9f9 0%, #f6f6f8 100%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 9999px;
      text-decoration: none;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.45), 0 8px 10px -6px rgba(37, 99, 235, 0.25);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      user-select: none;
      outline: none;
    }
    .redirect-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 30px -5px rgba(37, 99, 235, 0.55), 0 10px 12px -5px rgba(37, 99, 235, 0.35);
      background: linear-gradient(135deg, #ffffff 0%, #eff1f4 100%);
    }
    .redirect-btn:focus-visible {
      ring: 4px solid rgba(96, 165, 250, 0.5);
      outline: 2px solid #60a5fa;
      outline-offset: 4px;
    }
    .redirect-btn:active {
      transform: translateY(0) scale(0.98);
      box-shadow: 0 5px 15px -3px rgba(37, 99, 235, 0.4);
    }
    .redirect-btn svg {
      transition: transform 0.2s ease;
    }
    .redirect-btn:hover svg {
      transform: translateX(4px);
    }
  </style>
</head>
<body>
  <a href="https://anower77.github.io/complexity" class="redirect-btn" id="redirect-button" role="button">
    <span>Complexity</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="5" y1="12" x2="19" y2="12"></line>
      <polyline points="12 5 19 12 12 19"></polyline>
    </svg>
  </a>
</body>
</html>
